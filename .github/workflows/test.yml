name: Pester Tests & PSScriptAnalyzer

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser -SkipPublisherCheck

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path doc/ -Recurse -Settings doc/PSScriptAnalyzerSettings.psd1
          if ($results) {
            $results | Format-Table -Property Severity,ScriptName,Line,Message -AutoSize
            throw "PSScriptAnalyzer found $($results.Count) issue(s)"
          }
          Write-Host "PSScriptAnalyzer: All clear"

      - name: Run Pester Tests
        shell: pwsh
        run: |
          $result = Invoke-Pester -Path doc/tests -PassThru
          if ($result.FailedCount -gt 0) {
            throw "Pester: $($result.FailedCount) test(s) failed"
          }
          Write-Host "Pester: $($result.PassedCount) passed, 0 failed"
